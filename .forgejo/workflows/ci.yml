# edapack/xezim-bin -- Forgejo Actions.
#
# THIS FILE'S FIRST JOB IS TO EXIST. When .forgejo/workflows/ is absent the
# Forgejo runner falls back to running .github/workflows/ -- the fallback is
# DIRECTORY-level and evaluated per commit. One file here disarms the whole
# repository.
#
# WHY THIS IS A CHECK AND NOT A MIRROR OF THE BUILD. The real build runs
# `docker run` against stock manylinux images (and, in some repos, macOS and
# Windows runners) to compile an EDA tool from source. None of that is
# reproducible in catthehacker/ubuntu:act-22.04 -- there is no Docker daemon on
# this runner -- and a shadow that pretended otherwise would go red for reasons
# about the runner rather than about the code.
#
# WHAT IT ACTUALLY GUARDS. .github/workflows/ci.yml here is a THIN CALLER of
#
#     edapack/edapack-common/.github/workflows/build-release.yml@v1
#
# so this repo has no publish step of its own to gate -- the gating lives in
# edapack-common, and until 2026-08-31 there was none: `build_needed == 'true'`
# was the only condition, and manifest-diff.py says in its own docstring that a
# push always builds. A push published a release.
#
# The pin is worth staring at. `@v1` LOOKS immutable and is not: it is an
# actions/checkout@v4-style major-version alias that gets retargeted forward,
# so it currently points at the tip of edapack-common's `main`. That is why the
# check below asserts the pin rather than the gate -- the gate is somewhere
# else, and what can break HERE is the reference to it.

name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check for internal identifiers in tracked files
      # This repo is published to git.dvkit.org, so anything committed here is
      # public. Internal host names, tailnet addresses and CGNAT-range IPs must
      # not appear in tracked files -- if a build ever needs one it belongs in a
      # repository secret, which is masked in logs.
      run: |
        pattern='perch-char\.ts\.net|\.ts\.net|a9550|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]+\.[0-9]+'
        if git grep -nIE "$pattern" -- . ':!.forgejo/workflows/ci.yml' ; then
          echo "::error::internal identifier found in a tracked file (see matches above)"
          exit 1
        fi
        echo "OK: no internal identifiers in tracked files"

    - name: Install PyYAML
      # Not present in catthehacker/ubuntu:act-22.04 by default. The checks
      # below must read the workflows as YAML rather than by grepping: a gate
      # that is only true textually is exactly the class of bug being guarded
      # against. PEP 668 marks this image's interpreter externally-managed on
      # some rebuilds, hence the escalation.
      run: |
        python3 -c 'import yaml' 2>/dev/null && { echo "PyYAML already present"; exit 0; }
        python3 -m pip install -q pyyaml && exit 0
        python3 -m pip install -q --break-system-packages pyyaml && exit 0
        echo "::error::could not install PyYAML"; exit 1

    - name: The shared release pipeline must still resolve
      # A rename of edapack-common, of the workflow path, or of the `v1` alias
      # breaks this repo's entire release pipeline, and GitHub reports it as
      # "workflow was not found" HERE while edapack-common looks perfectly
      # healthy. This asserts the half that lives in this repository.
      #
      # NOTE ON INDENTATION: the heredoc body sits at the SAME column as the
      # rest of this run: block; outdenting it ends the block scalar early and
      # silently corrupts the workflow.
      run: |
        python3 - <<'PY'
        import pathlib, sys, yaml

        WANT = "edapack/edapack-common/.github/workflows/build-release.yml@"
        pins, local_pub = [], []

        # Same fragment-assembly reason as the publisher variant of this file.
        PUBLISH = tuple(a + b for a, b in (
            ("softprops/action", "-gh-release"), ("actions/create", "-release"),
            ("actions/upload", "-release-asset"), ("gh release", " create"),
            ("peaceiris/actions", "-gh-pages"), ("actions/deploy", "-pages"),
        ))

        for wf in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
            doc = yaml.safe_load(wf.read_text()) or {}
            if doc.get("on", doc.get(True)) is None:
                sys.exit(f"::error::{wf} has no `on:` block")
            for name, job in (doc.get("jobs") or {}).items():
                uses = job.get("uses") or ""
                if uses.startswith(WANT):
                    pins.append((str(wf), name, uses))
                for step in job.get("steps") or []:
                    text = (step.get("run") or "") + " " + (step.get("uses") or "")
                    if any(m in text for m in PUBLISH):
                        cond = str(step.get("if", "")) + " " + str(job.get("if", ""))
                        local_pub.append((f"{wf}:{name}", cond.strip()))

        if not pins:
            print(f"::error::no job calls {WANT}<ref>")
            print("::error::this repo is supposed to delegate its release pipeline;")
            print("::error::if that changed on purpose, it now needs its own gate job")
            sys.exit(1)

        bad = False
        for wf, name, uses in pins:
            ref = uses.rsplit("@", 1)[1]
            print(f"OK: {wf}:{name} -> {uses}")
            if ref != "v1":
                # Not a failure. A commit SHA here would be STRICTER than `v1`,
                # which moves; flag it so a change of pinning strategy is
                # visible rather than silent.
                print(f"::warning::{wf}:{name} pins `{ref}`, not the expected `v1`")

        # A caller that has grown its OWN publish step no longer inherits
        # edapack-common's gating, and nothing central would fix it.
        for label, cond in local_pub:
            if "github.event_name != 'push'" not in cond or "authority" not in cond:
                print(f"::error::{label} publishes locally without the full gate: "
                      f"if={cond!r}")
                bad = True

        sys.exit(1 if bad else 0)
        PY
