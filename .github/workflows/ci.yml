# RELEASE PATH -- read this before changing the `uses:` below.
#
# This repo does not publish anything itself. Its release pipeline is
# edapack/edapack-common's reusable build-release workflow, and the gating lives
# there: a `gate` job resolves the release-authority switch at
# https://dvkit.org/.well-known/release-authority.json and the publish job
# requires both `authority == 'github'` and an event that is not a push. That
# last clause is what makes this repo safe to mirror -- its history moves
# between Forgejo and GitHub on a cron, and git-sync produces exactly one kind
# of event, a push.
#
# THE PIN IS NOT IMMUTABLE. `@v1` is an actions/checkout@v4-style major-version
# alias that edapack-common retargets forward, so it currently points at the tip
# of that repo's `main`. Changing it -- or edapack-common moving it -- changes
# this repo's release behaviour with no commit here.
#
# This block is also load-bearing for the sync itself. git-sync's inbound
# publish preflight reads workflow files as TEXT and cannot follow a `uses:`
# into another repository, so it sees a reference to a release pipeline and no
# evidence of a gate, and refuses to pull the ref. Naming the switch here is how
# this file states the thing the scanner is actually asking about; the gate
# really is on, it is just one repository away. There is a counterpart check in
# .forgejo/workflows/ci.yml that asserts the pin still resolves.

name: CI
# Thin caller of the shared edapack build pipeline. All build/release logic
# (resolve inputs -> change-gate -> build matrix -> publish, with a release
# manifest) lives in edapack-common. Input components are declared in
# build-inputs.yaml. See https://dvkit.org/edapack/ (Developer Guide).
#
# Two tracks call the same reusable workflow:
#   dev     - weekly top-of-trunk snapshot, v<ver>.<run-id>, pre-release,
#             never moves `latest`.
#   release - newest upstream xezim tag, v<ver>, full release, moves `latest`,
#             body carries upstream's NOTES.md section for that version.
# They are independent jobs: each resolves the newest upstream tag itself and
# branches opposite ways on whether we have already released it, so a run that
# publishes a release does not also publish a redundant snapshot.
#
# CADENCE DIFFERS FROM verilator-bin, deliberately. Verilator tags every 6-8
# weeks; xezim tagged 0.10.3 -> 0.11.0 in five weeks (08-21, 09-03, 09-05,
# 09-18, 09-26). With a single weekly run the release track would win almost
# every Sunday, so the snapshot would almost never publish, and a tag could sit
# unbuilt for up to seven days. So the release track checks DAILY (a no-op run
# is one ~30 s resolve job) and the dev track runs only on the weekly cron.
# Precedence still holds on Sunday: both jobs run and the dev track stands down
# only if a release is being built in that same run.
on:
  push:
  schedule:
    - cron: "0 6 * * *"    # daily: release track only -- builds a new upstream tag, if any
    - cron: "0 12 * * 0"   # Sunday: both tracks -- dev publishes only if inputs changed
  workflow_dispatch:
    inputs:
      track:
        description: "Which track to run"
        type: choice
        options: [both, dev, release]
        default: both
      core_ref:
        description: "Build a specific xezim ref (tag/branch/sha), e.g. 0.11.0"
        type: string
      input_overrides:
        description: 'JSON map of dependency overrides'
        type: string
        default: "{}"
      force:
        description: "Build even if inputs are unchanged"
        type: boolean
        default: false
      prerelease:
        description: "Mark the dev-track release as prerelease"
        type: boolean
        default: true

jobs:
  # Newest upstream tag we have not published yet. Skipped on push: a recipe
  # commit cannot change what upstream has tagged. Runs on both crons.
  release:
    if: >-
      github.event_name != 'push' &&
      (github.event_name != 'workflow_dispatch' || inputs.track != 'dev')
    uses: edapack/edapack-common/.github/workflows/build-release.yml@v1
    with:
      package: xezim-bin
      track: release
      targets: |
        [
          {"name":"manylinux_2_28_x86_64","runs-on":"ubuntu-latest","kind":"docker","image":"quay.io/pypa/manylinux_2_28_x86_64"},
          {"name":"manylinux_2_34_x86_64","runs-on":"ubuntu-latest","kind":"docker","image":"quay.io/pypa/manylinux_2_34_x86_64"},
          {"name":"manylinux2014_x86_64","runs-on":"ubuntu-latest","kind":"docker","image":"quay.io/pypa/manylinux2014_x86_64"},
          {"name":"manylinux_2_28_aarch64","runs-on":"ubuntu-24.04-arm","kind":"docker","image":"quay.io/pypa/manylinux_2_28_aarch64"},
          {"name":"manylinux_2_34_aarch64","runs-on":"ubuntu-24.04-arm","kind":"docker","image":"quay.io/pypa/manylinux_2_34_aarch64"},
          {"name":"macos-arm64","runs-on":"macos-14","kind":"native"}
        ]
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}

  # Top-of-trunk snapshot. Weekly cron only (not the daily one), plus push and
  # dispatch. Stands down inside `resolve` when the release track has something
  # to build, so no dependency on the release job is needed here.
  dev:
    if: >-
      (github.event_name != 'schedule' || github.event.schedule == '0 12 * * 0') &&
      (github.event_name != 'workflow_dispatch' || inputs.track != 'release')
    uses: edapack/edapack-common/.github/workflows/build-release.yml@v1
    with:
      package: xezim-bin
      track: dev
      # Same list as the release track, so platform coverage cannot drift.
      targets: |
        [
          {"name":"manylinux_2_28_x86_64","runs-on":"ubuntu-latest","kind":"docker","image":"quay.io/pypa/manylinux_2_28_x86_64"},
          {"name":"manylinux_2_34_x86_64","runs-on":"ubuntu-latest","kind":"docker","image":"quay.io/pypa/manylinux_2_34_x86_64"},
          {"name":"manylinux2014_x86_64","runs-on":"ubuntu-latest","kind":"docker","image":"quay.io/pypa/manylinux2014_x86_64"},
          {"name":"manylinux_2_28_aarch64","runs-on":"ubuntu-24.04-arm","kind":"docker","image":"quay.io/pypa/manylinux_2_28_aarch64"},
          {"name":"manylinux_2_34_aarch64","runs-on":"ubuntu-24.04-arm","kind":"docker","image":"quay.io/pypa/manylinux_2_34_aarch64"},
          {"name":"macos-arm64","runs-on":"macos-14","kind":"native"}
        ]
      core_ref: ${{ inputs.core_ref || '' }}
      input_overrides: ${{ inputs.input_overrides || '{}' }}
      # force only on an explicit dispatch; prerelease defaults true but must
      # still honor an unchecked (false) dispatch box (`false || true` == true).
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
      # Same deliberate exception as verilator-bin: this repo has a `release`
      # track that publishes full releases from upstream tags, so that is what
      # ivpm should serve; dev-track trunk snapshots stay opt-in prereleases.
      prerelease: ${{ github.event_name != 'workflow_dispatch' || inputs.prerelease }}
